name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # P0-REL-02: deterministic install from the lockfile.
      - run: npm ci --no-audit --no-fund
      # P0-REL-03: every gate runs unconditionally; verify includes a clean
      # build (dist is gitignored, tsbuildinfo is untracked).
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm run docs:check
      - run: npm run secret:scan
      - run: npm run license:report
      - run: npm run sbom:generate
      - run: npm run artifact:audit
      # P0-REL-04: dependency advisories at high+ fail the build. No `|| true`.
      - run: npm audit --omit=dev --audit-level=high
      - name: Check no generated schema drift
        run: git diff --exit-code -- schemas

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
